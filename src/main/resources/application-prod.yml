server:
  port: 8080
  address: 0.0.0.0

spring:
  config:
    import:
      - file:/home/user/.env.prod[.properties]
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region.static: ${AWS_REGION}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.sns.marigold: WARN
    audit: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  storage:
    type: s3
    s3:
      bucket: ${AWS_S3_BUCKET}

    # url-ttl(기본 15m) <= token-ttl(기본 1h) < cleanup.minimum-age 를 지켜야 기동된다
    upload:
      token-secret: ${UPLOAD_TOKEN_SECRET}

url:
  frontend:
    origin: ${FRONTEND_ORIGIN}
    auth:
      login: ${url.frontend.origin}/auth/login
      signup: ${url.frontend.origin}/auth/signup
      callback: ${url.frontend.origin}/auth/callback
  backend:
    api-prefix: /api/v1
    auth:
      oauth2:
        base: /oauth2
        endpoint:
          base: ${url.backend.auth.oauth2.base}/authorization
          naver: ${url.backend.auth.oauth2.endpoint.base}/naver
          kakao: ${url.backend.auth.oauth2.endpoint.base}/kakao
        redirection: ${url.backend.auth.oauth2.base}/code/*
