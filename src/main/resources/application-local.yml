server:
  port: 8080
  address: 127.0.0.1

spring:
  config:
    import:
      - optional:file:secrets/back/.env.local[.properties]
      - optional:file:../secrets/back/.env.local[.properties]

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/marigold?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"

  cloud:
    aws:
      s3:
        enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.sns.marigold: DEBUG
    audit: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  storage:
    type: local
    local:
      root-path: ${LOCAL_STORAGE_ROOT:./uploads}
      public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
      signing-secret: ${LOCAL_STORAGE_SIGNING_SECRET:local-dev-signing-secret}
      view-url-ttl-minutes: ${LOCAL_STORAGE_VIEW_URL_TTL_MINUTES:60}
      download-url-ttl-minutes: ${LOCAL_STORAGE_DOWNLOAD_URL_TTL_MINUTES:10}
  auth:
    recent-auth:
      ttl-seconds: 300

url:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:8000}
    auth:
      login: ${url.frontend.origin}/auth/login
      signup: ${url.frontend.origin}/auth/signup
      callback: ${url.frontend.origin}/auth/callback
  backend:
    api-prefix: /api/v1
    auth:
      oauth2:
        base: /oauth2
        endpoint:
          base: ${url.backend.auth.oauth2.base}/authorization
          naver: ${url.backend.auth.oauth2.endpoint.base}/naver
          kakao: ${url.backend.auth.oauth2.endpoint.base}/kakao
        redirection: ${url.backend.auth.oauth2.base}/code/*
