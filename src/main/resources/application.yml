spring:
  application:
    name: marigold
  profiles:
    include: oauth
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB # 최대 이미지 8개(40MiB)와 multipart 부가 데이터 포함

server:
  servlet:
    session:
      timeout: 30m # 30분 (JWT 사용 시 의미없는 설정. 현재는 JWT 사용 중이므로 직접적으로 HttpSession을 생성하지 않음.)
  tomcat:
    max-part-count: 20
    max-swallow-size: 64MB # 50MiB 초과 요청도 413 응답을 받을 수 있도록 잔여 본문 읽기에 여유 부여

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true

# JWT 설정
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:3600}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:86400}
