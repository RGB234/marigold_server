spring:
  application:
    name: marigold
  profiles:
    include: oauth

server:
  servlet:
    session:
      timeout: 30m # 30분 (JWT 사용 시 의미없는 설정. 현재는 JWT 사용 중이므로 직접적으로 HttpSession을 생성하지 않음.)

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      percentiles-histogram:
        http.server.requests: true

app:
  auth:
    jwt:
      access:
        secret: ${ACCESS_SECRET}
        ttl-seconds: 600
      refresh:
        secret: ${REFRESH_SECRET}
        ttl-seconds: 86400
    csrf:
      secret: ${CSRF_SECRET}
      ttl-seconds: ${app.auth.jwt.refresh.ttl-seconds}
    recent-auth:
      ttl-seconds: 300
